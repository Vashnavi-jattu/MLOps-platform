[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-platform"
version = "0.1.0"
description = "A self-service platform for the machine-learning lifecycle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mlops = "mlops_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
