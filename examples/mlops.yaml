schema_version: 1

project:
  name: iranian-churn
  description: Churn classification using the UCI Iranian Churn dataset

dataset:
  path: data/iranian_churn.csv
  target: Churn

training:
  task: classification
  test_size: 0.2
  random_seed: 42
  models:
    - logistic_regression
    - random_forest

tracking:
  experiment_name: iranian-churn
  tracking_uri: http://localhost:5000

registry:
  model_name: iranian-churn-classifier
