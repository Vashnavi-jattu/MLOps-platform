schema_version: 1

project:
  name: customer-churn
  description: Example binary classification project

dataset:
  path: data/churn.csv
  target: churn

training:
  task: classification
  test_size: 0.2
  random_seed: 42
  models:
    - logistic_regression
    - random_forest

tracking:
  experiment_name: customer-churn
  tracking_uri: http://localhost:5000

registry:
  model_name: customer-churn-classifier
