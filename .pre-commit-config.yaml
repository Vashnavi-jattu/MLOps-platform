repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy src
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
